services:
  broker-service:
    build: ./broker-service
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      mode: replicated
      replicas: 1
    depends_on:
      - auth-service

  auth-service:
    build: ./auth-service
    ports:
      - "8081:8081"
    environment:
      DSN: "host=db user=postgres password=password dbname=authdb port=5432 sslmode=disable TimeZone=UTC"
    depends_on:
      - db

  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authdb
    ports:
      - "5434:5432"
    restart: always
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data: